# Traceon AI - Docker Compose Configuration

version: '3.8'

services:
  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:3001/api
      - NEXT_PUBLIC_MOCK_API=false
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - traceon-network

  # Backend API (placeholder for future implementation)
  backend:
    # Will be implemented in Phase 2
    image: nginx:alpine  # Temporary placeholder
    ports:
      - "3001:80"
    volumes:
      - ./backend/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - traceon-network

  # Database (placeholder for future implementation)
  database:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=traceon_ai
      - POSTGRES_USER=traceon
      - POSTGRES_PASSWORD=changeme123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - traceon-network

  # Redis Cache (placeholder for future implementation)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - traceon-network

networks:
  traceon-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
